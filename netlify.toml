# Netlify reads this, so nothing needs setting by hand in its dashboard

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The app does its own routing, so every address goes to index.html.
# Without this, opening /bookings directly or refreshing it gives a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built files have a hash in their name, so the browser can keep them for good
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
